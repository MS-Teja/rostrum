<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>How Kafka partitions work</title>
    <style>
      :root {
        --rs-bg: #08090b;
        --rs-bg-glow: #141821;
        --rs-track: #101319;
        --rs-track-stroke: #232833;
        --rs-surface: #1d2129;
        --rs-stroke: #363c48;
        --rs-edge: #4a5160;
        --rs-text: #f4f5f7;
        --rs-muted: #9aa0ac;
        --rs-accent: #5ea0ff;
        --rs-accent-soft: rgba(94, 160, 255, 0.16);
        --rs-accent-text: #cfe0ff;
        --rs-font: Inter, sans-serif;
        --rs-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--rs-bg);
      }
      #backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 75% 65% at 50% 46%, var(--rs-bg-glow), var(--rs-bg) 72%);
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #scene {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
      }
      /* Static grain keeps the dark gradient from banding after compression. */
      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.06;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        pointer-events: none;
      }
    </style>
    <script src="vendor/rostrum.js"></script>
    <script src="timing.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="1920"
      data-height="1080"
      data-no-timeline
    >
      <div id="backdrop"></div>
      <div id="world"><svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
      <div id="grain"></div>
      <div id="fade"></div>
      <audio
        id="narration"
        class="clip"
        src="audio/voice.wav"
        data-start="0.4"
        data-track-index="1"
        data-volume="1"
      ></audio>
      <audio id="sfx" class="clip" src="audio/sfx.wav" data-start="0" data-track-index="2" data-volume="1"></audio>
    </div>
    <script src="scene.js"></script>
  </body>
</html>
